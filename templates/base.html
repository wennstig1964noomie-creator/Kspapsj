<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>AI Alpaca Trading Bot</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { font-family: -apple-system, system-ui, sans-serif; max-width: 960px; margin: 2rem auto; padding: 0 1rem; color: #1a1a1a; background: #fafafa; }
    h1 { font-size: 1.6rem; }
    h2 { font-size: 1.1rem; margin-top: 1.5rem; }
    .card { background: white; border: 1px solid #e2e2e2; border-radius: 8px; padding: 1rem 1.25rem; margin: 1rem 0; box-shadow: 0 1px 2px rgba(0,0,0,.04); }
    .row { display: flex; gap: 1rem; flex-wrap: wrap; }
    .row > .card { flex: 1 1 220px; }
    input[type=text], input[type=password] { width: 100%; padding: .55rem .65rem; border: 1px solid #ccc; border-radius: 6px; font-size: 1rem; }
    label { display: block; margin: .75rem 0 .25rem; font-weight: 600; font-size: .9rem; }
    button { background: #1f6feb; color: white; border: 0; padding: .6rem 1rem; border-radius: 6px; font-weight: 600; cursor: pointer; font-size: .95rem; }
    button.secondary { background: #555; }
    button.danger { background: #c0392b; }
    table { width: 100%; border-collapse: collapse; font-size: .9rem; }
    th, td { text-align: left; padding: .45rem .5rem; border-bottom: 1px solid #eee; }
    .flash { padding: .6rem .9rem; border-radius: 6px; margin: .5rem 0; }
    .flash.ok { background: #e6f6ec; color: #1f6f3b; }
    .flash.error { background: #fdecea; color: #a02622; }
    .muted { color: #777; font-size: .85rem; }
    .pill { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: .75rem; font-weight: 600; }
    .pill.green { background: #e6f6ec; color: #1f6f3b; }
    .pill.red { background: #fdecea; color: #a02622; }
    .pill.gray { background: #eee; color: #555; }
    form.inline { display: inline; }
    .disclaimer { background: #fff7e6; border: 1px solid #f0c674; padding: .75rem 1rem; border-radius: 6px; font-size: .85rem; color: #6b4a00; }
  </style>
</head>
<body>
  <h1>AI Alpaca Trading Bot</h1>
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for cat, msg in messages %}<div class="flash {{ cat }}">{{ msg }}</div>{% endfor %}
  {% endwith %}
  {% block body %}{% endblock %}
  <p class="muted" style="margin-top:2rem">Trading involves substantial risk. Past performance does not predict future results.</p>
</body>
</html>
